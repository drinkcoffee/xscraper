[package]
name = "xscraper"
version = "0.1.0"
edition = "2021"
description = "Web scraper service with CLI and MCP server: fetches a URL and dumps visible text and links"
license = "MIT"
repository = "https://github.com/yourusername/xscraper"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["full"] }
rmcp = { version = "0.3", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
scraper = "0.19"
url = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
schemars = "1.0"
